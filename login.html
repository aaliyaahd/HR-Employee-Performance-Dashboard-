<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HR Insight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon mx-auto">HR</div>
                <h2>Welcome to HR Insight</h2>
                <p>Sign in to manage your workforce</p>
            </div>

            <form id="loginForm" action="index.html">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required value="aliyah@hrinsight.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required value="password123">
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary login-btn">Sign In</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#">Create Account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
